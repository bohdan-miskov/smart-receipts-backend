name: Destroy Backend (Preview Environment)

on:
  delete:

permissions:
  id-token: write
  contents: read

jobs:
  destroy-preview:
    name: Destroy Feature Preview
    if: startsWith(github.event.ref, 'feature/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: 'arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubDeployRole'
          aws-region: ${{secrets.AWS_REGION}}

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Extract branch name for ENV
        id: branch-name
        run: echo "CLEAN_NAME=$(echo '${{github.event.ref}}' | sed 's/\//-/g')" >> $GITHUB_ENV

      - name: CDK Destroy (Cleanup)
        run: cdk destroy --all --force
        env:
          APP_ENV: ${{env.CLEAN_NAME}}
